name: Intégration continue

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: API (NestJS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parcform
          POSTGRES_PASSWORD: parcform
          POSTGRES_DB: parcform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U parcform" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://parcform:parcform@localhost:5432/parcform_test?schema=public
      JWT_SECRET: secret-de-ci-suffisamment-long-pour-la-validation
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npx prisma migrate deploy
      - name: Vérifier que les migrations correspondent au schéma Prisma
        run: |
          PGPASSWORD=parcform psql -h localhost -U parcform -d parcform_test -c "CREATE DATABASE parcform_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://parcform:parcform@localhost:5432/parcform_shadow --exit-code
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    name: Interface (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
