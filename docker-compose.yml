# ParcForm — l'application complète, sans rien installer d'autre que Docker
#
#   docker compose up -d --build
#
# Application : http://localhost:8080 — Documentation API : http://localhost:8080/api/docs
# Comptes de démonstration : admin@ / gestionnaire@ / adminsalle@ / formateur@parcform.local, mot de passe ParcForm#2026
#
# Aucun fichier .env n'est nécessaire pour la démonstration. Pour un vrai déploiement,
# copier .env.example en .env et changer POSTGRES_PASSWORD, mettre SEED_DEMO=false
# et retirer le service « agent » (agent simulé).

name: parcform

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: parcform
      POSTGRES_USER: parcform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parcform}
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parcform -d parcform']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [interne]
    # Pas de port publié : la base n'est joignable que par l'API

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://parcform:${POSTGRES_PASSWORD:-parcform}@db:5432/parcform?schema=public
      # Vide = un secret aléatoire est généré au premier démarrage et conservé dans le volume « secrets-api »
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      SEED_DEMO: ${SEED_DEMO:-true}
      SEED_MOT_DE_PASSE: ${SEED_MOT_DE_PASSE:-ParcForm#2026}
      POSTE_HORS_LIGNE_SECONDES: ${POSTE_HORS_LIGNE_SECONDES:-120}
      CPU_ALERTE_POURCENT: ${CPU_ALERTE_POURCENT:-90}
      TZ: Europe/Paris
    volumes:
      - secrets-api:/app/secrets
    networks: [interne]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_COMPTES_DEMO: ${SEED_DEMO:-true}
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - '${PORT_HTTP:-8080}:80'
    networks: [interne]

  # Agent simulé : fait vivre les 24 postes de démonstration (à retirer en production)
  agent:
    build: ./agent
    restart: unless-stopped
    depends_on: [backend]
    environment:
      API_URL: http://backend:3000/api
      INTERVALLE: 10
      PROBA_INTERDIT: 0.01
    networks: [interne]

volumes:
  donnees-postgres:
  secrets-api:

networks:
  interne:
