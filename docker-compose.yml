# ParcForm — déploiement complet
#   cp .env.example .env   (puis personnaliser les secrets)
#   docker compose --profile demo up -d --build      → avec l'agent simulé et les données de démo
#   docker compose up -d --build                      → sans l'agent simulé
# Application : http://localhost:8080 — Documentation API : http://localhost:8080/api/docs

name: parcform

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: parcform
      POSTGRES_USER: parcform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parcform -d parcform']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [interne]
    # Pas de port publié : la base n'est joignable que par l'API

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://parcform:${POSTGRES_PASSWORD}@db:5432/parcform?schema=public
      JWT_SECRET: ${JWT_SECRET:?Définir JWT_SECRET dans .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_MOT_DE_PASSE: ${SEED_MOT_DE_PASSE:-ParcForm#2026}
      POSTE_HORS_LIGNE_SECONDES: ${POSTE_HORS_LIGNE_SECONDES:-120}
      CPU_ALERTE_POURCENT: ${CPU_ALERTE_POURCENT:-90}
      TZ: Europe/Paris
    networks: [interne]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_COMPTES_DEMO: ${SEED_DEMO:-false}
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - '${PORT_HTTP:-8080}:80'
    networks: [interne]

  agent:
    build: ./agent
    restart: unless-stopped
    profiles: [demo]
    depends_on: [backend]
    environment:
      API_URL: http://backend:3000/api
      INTERVALLE: 10
      PROBA_INTERDIT: 0.01
    networks: [interne]

volumes:
  donnees-postgres:

networks:
  interne:
